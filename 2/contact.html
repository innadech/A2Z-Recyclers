<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Contact Us - A2Z Recyclers</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Header same as index -->
    <header>
      <div class="logo-container">
        <img
          src="https://via.placeholder.com/150x80?text=GELOS+LOGO"
          alt="Logo"
        />
      </div>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="household.html">Household</a></li>
          <li><a href="business.html">Business</a></li>
          <li><a href="contact.html">Contact Us</a></li>
        </ul>
      </nav>
    </header>

    <main style="grid-template-columns: 1fr">
      <section class="form-section">
        <h2>Workshop Enquiry & Registration</h2>
        <p>
          Type "Register me" in the message box to join our next event[cite: 1].
        </p>
        <form action="#">
          <label for="name">Full Name</label>
          <input type="text" id="name" required />

          <label for="email">Email Address</label>
          <input type="email" id="email" required />

          <label for="subject">Enquiry Type</label>
          <select id="subject">
            <option>General Interest</option>
            <option>Pennant Hills Workshop</option>
            <option>Business Partnership</option>
          </select>

          <label for="msg">Message</label>
          <textarea
            id="msg"
            rows="5"
            placeholder='Enter "Register me" here...'
          ></textarea>

          <button type="submit">Submit Request</button>
        </form>
      </section>
    </main>

    <footer>
      <p>Direct Support: 02 0000 0000 | contact@a2zrecyclers.com.au[cite: 3]</p>
    </footer>
  </body>
</html>
